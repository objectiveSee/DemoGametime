# Affirm is offered only over $100: visible at 2 tickets ($135.90), gone at 1 ($69.20), back at 2.
appId: host.exp.Exponent
name: Order loads and Affirm tracks the $100 threshold
---
- runFlow: _launch.yaml
- assertVisible: "Warriors vs Lakers"
- assertVisible: "$135.90"
- assertVisible: "Pay over time with affirm"
- assertVisible:
    id: payment-method-card-header

- tapOn:
    id: quantity-decrement
- extendedWaitUntil:
    visible: "$69.20"
    timeout: 5000
- assertNotVisible: "Pay over time with affirm"
- assertVisible:
    id: payment-method-card-header

- tapOn:
    id: quantity-increment
- extendedWaitUntil:
    visible: "$135.90"
    timeout: 5000
- assertVisible: "Pay over time with affirm"

# Affirm is offered only over $100. The quantity steps up and down a few times so the total's
# rolling digits play on every reprice: 2 -> 3 -> 4 -> 3 -> 2 -> 1 -> 2. Each tap waits for its
# new total, then a short beat lets the roll finish on camera before the next one.
appId: host.exp.Exponent
name: Order loads, the total rolls, and Affirm tracks the $100 threshold
---
- runFlow: _launch.yaml
- assertVisible: "Warriors vs Lakers"
- assertVisible: "$135.90"
- assertVisible: "Pay over time with affirm"
- assertVisible:
    id: payment-method-card-header
- tapOn:
    id: quantity-increment
- extendedWaitUntil:
    visible: "$202.60"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: quantity-increment
- extendedWaitUntil:
    visible: "$269.30"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: quantity-decrement
- extendedWaitUntil:
    visible: "$202.60"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: quantity-decrement
- extendedWaitUntil:
    visible: "$135.90"
    timeout: 5000
- assertVisible: "Pay over time with affirm"
- tapOn:
    id: quantity-decrement
- extendedWaitUntil:
    visible: "$69.20"
    timeout: 5000
- assertNotVisible: "Pay over time with affirm"
- assertVisible:
    id: payment-method-card-header
- tapOn:
    id: quantity-increment
- extendedWaitUntil:
    visible: "$135.90"
    timeout: 5000
- assertVisible: "Pay over time with affirm"
- runFlow: _hold.yaml

# The no-double-charge guarantee, exercised for real: kill the app while a charge is in flight,
# relaunch, and watch recovery replay the persisted attempt (same idempotency key) instead of
# charging again. The mock server's delay override makes the timing deterministic: 20 s is long
# enough that the relaunch's replay arrives while the original charge is still processing, so the
# server parks the replay on the same in-flight charge and "Checking your payment…" stays up long
# enough to assert. The flow then asserts the single charge against the server's charge counter;
# server/server.log shows the same evidence: one pay_ id, with "(replayed)" on the second POST line.
appId: "${maestro.platform == 'android' ? 'host.exp.exponent' : 'host.exp.Exponent'}"
name: Kill and relaunch mid-charge, exactly one charge
---
- runScript:
    file: scripts/set-delay.js
    env:
      DELAY_MS: "20000"
- runScript:
    file: scripts/count-charges.js
    env:
      PHASE: before
- runFlow: _launch.yaml
- tapOn:
    id: ${output.walletButton}
# The sheet auto-authorizes; the snapshot is persisted just before the POST goes out.
- extendedWaitUntil:
    visible: "Processing payment…"
    timeout: 15000
# Kill Expo Go mid-request, then cold-start back into the app.
- runFlow: _open-project.yaml
# Relaunch finds the snapshot: outcome unknown until the server answers the replay.
- extendedWaitUntil:
    visible: "Checking your payment…"
    timeout: 30000
# The replay resolves to the original charge's outcome.
- extendedWaitUntil:
    visible: "You're going."
    timeout: 40000
- assertVisible: "GT-[A-Z0-9]{6}"
# Restore the server's default delay (skipped if an assert above fails — re-run or POST
# {"ms":null} to localhost:4000/debug/delay by hand).
- runScript:
    file: scripts/set-delay.js
    env:
      DELAY_MS: "null"
# Exactly one charge, asserted against the server: one new idempotency key since the start.
- runScript:
    file: scripts/count-charges.js
    env:
      PHASE: after
- runFlow: _hold.yaml

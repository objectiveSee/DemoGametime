# Affirm is redirect-shaped: the tap opens a real browser (ASWebAuthenticationSession) over the
# app — the app genuinely loses focus — and the hosted demo page deep-links back with a token,
# which completes the purchase with no further in-app interaction.
#
# Maestro on iOS cannot see web content (the browser's accessibility tree isn't exposed), so the
# in-browser taps are positional against the page we control: "Approve plan" sits at 50%,65% on
# this device size. Screenshots are the ground truth if this flow misbehaves. On Android the page
# opens in a Chrome Custom Tab, whose content Maestro can see, so the button is tapped by text.
appId: "${maestro.platform == 'android' ? 'host.exp.exponent' : 'host.exp.Exponent'}"
name: Affirm redirect round trip
---
- runFlow: _launch.yaml
- tapOn: "Pay over time with affirm"
- waitForAnimationToEnd:
    timeout: 5000
# "Approve plan" on the hosted page.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%, 65%"
- runFlow:
    when:
      platform: Android
    commands:
      # A fresh emulator's Chrome shows its first-run screen before the page.
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - tapOn: "Approve plan"
- extendedWaitUntil:
    visible: "You're going."
    timeout: 25000
- assertVisible: "GT-[A-Z0-9]{6}"
- runFlow: _hold.yaml

# Express decline handled gracefully. Long-pressing an express button is the hidden test hook:
# the same one-tap flow runs, but the stub authorization hands back a tok_declined… token, which
# the server declines. The fan sees the declined screen and Try Again lands back on idle checkout.
appId: host.exp.Exponent
name: Express declined, then back to checkout
---
- runFlow: _launch.yaml
- longPressOn:
    id: express-apple_pay
- extendedWaitUntil:
    visible: "Payment declined."
    timeout: 25000
- assertVisible: "The payment could not be completed. You have not been charged."
- tapOn:
    id: retry-button
- assertVisible: "or pay with card"
- assertVisible:
    id: express-apple_pay
